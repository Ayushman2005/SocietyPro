<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forgot Password - SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
</head>
  <body class="auth-body">
    <div class="auth-overlay"></div>
    <div class="auth-container">
      <div
        style="
          font-size: 40px;
          color: var(--primary-orange);
          margin-bottom: 10px;
        "
      >
        <i class="ri-mail-lock-line"></i>
      </div>
      <h1>Reset Password</h1>
      <p>Enter your email to receive a verification code.</p>

      <form method="POST" action="/forgot_password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <label class="modern-label" style="text-align: left"
          >Email Address</label
        >
        <div class="input-wrapper">
          <i class="ri-mail-send-line input-icon"></i>
          <input
            class="modern-input"
            type="email"
            name="email"
            placeholder="user@example.com"
            required
          />
        </div>

        <button class="primary-btn-glow" type="submit">
          Send OTP <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <div style="margin-top: 20px">
        <a href="/user/login" class="auth-link"
          ><i class="ri-arrow-left-line"></i> Back to Login</a
        >
      </div>
    </div>
  </body>
</html>
