<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify Identity | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
    <style>
      .card {
        background: var(--glass-surface);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        border-radius: var(--radius-xl);
        padding: 44px 40px;
        width: 100%;
        max-width: 430px;
        box-shadow: 0 12px 40px rgba(31, 38, 135, 0.12);
        text-align: center;
        position: relative;
        z-index: 10;
        animation: cardIn 0.7s cubic-bezier(0.23, 1, 0.32, 1) both;
        border: 1px solid var(--glass-border);
        border-top: 1px solid var(--glass-highlight);
        border-left: 1px solid var(--glass-highlight);
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(36px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }

      /* Shield icon */
      .shield-wrap {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        position: relative;
      }

      .shield-wrap .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--primary);
        border-right-color: #87cefa;
        animation: spin 3s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .shield-inner {
        position: absolute;
        inset: 10px;
        background: linear-gradient(135deg, #87cefa 0%, var(--primary) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: #fff;
        box-shadow: 0 8px 24px var(--primary-glow);
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 8px 24px var(--primary-glow); transform: scale(1); }
        50%       { box-shadow: 0 12px 32px rgba(0, 191, 255, 0.55); transform: scale(1.04); }
      }

      .card-title {
        font-size: 26px;
        font-weight: 800;
        color: var(--text-white);
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }

      .card-subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 32px;
        line-height: 1.6;
      }

      /* --- OTP Boxes --- */
      .otp-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 14px;
        text-align: left;
      }

      .otp-boxes {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 28px;
      }

      .otp-box {
        width: 56px;
        height: 62px;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.8);
        font-size: 26px;
        font-weight: 800;
        color: var(--text-white);
        text-align: center;
        outline: none;
        transition: all 0.25s ease;
        caret-color: var(--primary);
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .otp-box:focus {
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(0, 191, 255, 0.14);
        transform: translateY(-4px) scale(1.05); /* more interactive */
      }

      .otp-box.filled {
        border-color: var(--primary);
        background: rgba(0, 191, 255, 0.05);
        color: var(--primary);
      }

      .otp-hidden {
        display: none;
      }

      /* Timer */
      .timer-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 24px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .timer-badge {
        background: linear-gradient(135deg, #87cefa 0%, var(--primary) 100%);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        padding: 3px 10px;
        border-radius: 20px;
        min-width: 44px;
        display: inline-block;
        text-align: center;
      }

      .timer-badge.expired {
        background: #e2e8f0;
        color: #94a3b8;
      }

      /* Submit button */
      .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #87cefa 0%, var(--primary) 100%);
        border: none;
        border-radius: var(--radius-pill);
        color: #fff;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 8px 24px var(--primary-glow);
        letter-spacing: 0.02em;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px var(--primary-glow);
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      /* Resend link */
      .resend-row {
        margin-top: 22px;
        font-size: 13.5px;
        color: #94a3b8;
      }

      .resend-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 13.5px;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--primary);
        padding: 0;
        transition: color 0.2s;
      }

      .resend-btn:hover { color: #87cefa; }
      .resend-btn:disabled { color: #cbd5e1; cursor: not-allowed; }

      /* Divider */
      .divider {
        border: none;
        border-top: 1px solid var(--glass-border);
        margin: 24px 0 20px;
        opacity: 0.5;
      }

      /* Back link */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }

      .back-link:hover { color: var(--primary); }

      .error-toast {
        position: fixed;
        top: 22px;
        right: 22px;
        background: #ef4444;
        color: #fff;
        padding: 14px 22px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(239,68,68,0.30);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 999;
        animation: toastIn 0.4s ease;
      }

      @keyframes toastIn {
        from { opacity: 0; transform: translateX(30px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    </style>
  </head>

  <body class="auth-body">
    <div class="card">
      <!-- Animated shield icon -->
      <div class="shield-wrap">
        <div class="ring"></div>
        <div class="shield-inner">
          <i class="ri-shield-check-line"></i>
        </div>
      </div>

      <h1 class="card-title">Verify Your Identity</h1>
      <p class="card-subtitle">
        We sent a 6-digit security code to your registered email.<br />
        Enter it below to continue.
      </p>

      <form method="POST" action="/verify_otp" id="otpForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="otp" id="otpValue" class="otp-hidden" />

        <p class="otp-label">Enter OTP</p>

        <div class="otp-boxes">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="0" autocomplete="off" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="1" autocomplete="off" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="4" autocomplete="off" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="5" autocomplete="off" />
        </div>

        <!-- Countdown timer -->
        <div class="timer-row">
          <i class="ri-time-line"></i>
          Code expires in&nbsp;<span class="timer-badge" id="timerBadge">05:00</span>
        </div>

        <button class="submit-btn" type="submit" id="verifyBtn">
          <i class="ri-shield-check-line"></i>
          Verify &amp; Continue
        </button>
      </form>

      <hr class="divider" />

      <div class="resend-row">
        Didn't receive the code?&nbsp;
        <button class="resend-btn" id="resendBtn" disabled onclick="handleResend()">
          Resend OTP
        </button>
      </div>

      <div style="margin-top: 18px;">
        <a href="/" class="back-link">
          <i class="ri-arrow-left-line"></i> Back to Home
        </a>
      </div>
    </div>

    {% if error %}
    <div class="error-toast">
      <i class="ri-error-warning-line"></i> {{ error }}
    </div>
    {% endif %}

    <script>
      /* ── OTP Box Navigation ──────────────────────────────────── */
      const boxes = document.querySelectorAll(".otp-box");
      const otpValue = document.getElementById("otpValue");
      const form = document.getElementById("otpForm");

      boxes.forEach((box, idx) => {
        box.addEventListener("input", (e) => {
          const val = e.target.value.replace(/\D/g, "");
          e.target.value = val.slice(-1);
          if (val && idx < boxes.length - 1) boxes[idx + 1].focus();
          box.classList.toggle("filled", !!e.target.value);
          updateHidden();
        });

        box.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !box.value && idx > 0) {
            boxes[idx - 1].value = "";
            boxes[idx - 1].classList.remove("filled");
            boxes[idx - 1].focus();
            updateHidden();
          }
        });

        box.addEventListener("paste", (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData)
            .getData("text").replace(/\D/g, "").slice(0, 6);
          pasted.split("").forEach((ch, i) => {
            if (boxes[i]) {
              boxes[i].value = ch;
              boxes[i].classList.add("filled");
            }
          });
          updateHidden();
          const nextEmpty = [...boxes].findIndex(b => !b.value);
          (nextEmpty === -1 ? boxes[5] : boxes[nextEmpty]).focus();
        });
      });

      function updateHidden() {
        otpValue.value = [...boxes].map(b => b.value).join("");
      }

      /* Auto-submit when all 6 filled */
      form.addEventListener("input", () => {
        if ([...boxes].every(b => b.value)) {
          updateHidden();
        }
      });

      /* ── Countdown Timer ─────────────────────────────────────── */
      const badge   = document.getElementById("timerBadge");
      const resend  = document.getElementById("resendBtn");
      let seconds   = 300; // 5 minutes

      const timer = setInterval(() => {
        seconds--;
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        badge.textContent = `${m}:${s}`;
        if (seconds <= 0) {
          clearInterval(timer);
          badge.textContent = "Expired";
          badge.classList.add("expired");
          resend.disabled = false;
        }
      }, 1000);

      /* ── Resend Handler ──────────────────────────────────────── */
      function handleResend() {
        window.location.href = "/forgot_password";
      }

      /* Auto-dismiss error toast */
      const toast = document.querySelector(".error-toast");
      if (toast) setTimeout(() => toast.remove(), 4000);

      /* Focus first box on load */
      boxes[0].focus();
    </script>
  </body>
</html>
