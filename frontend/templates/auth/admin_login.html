<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Portal | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    
    <style>
      .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-deep);
      }

      .glass-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 28px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .icon-header {
        font-size: 50px;
        color: #ff8c00;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.3));
      }

      .modern-input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .glass-input {
        width: 100%;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 15px;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        margin-top: 8px;
        outline: none;
        transition: all 0.3s ease;
      }

      .glass-input::placeholder {
        color: #94a3b8;
      }

      .glass-input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.12);
      }

      .captcha-container {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        padding: 10px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .btn-glass {
        background: linear-gradient(135deg, #ff8c00, #ff5500);
        color: #ffffff;
        border: none;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
      }

      .btn-glass:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 140, 0, 0.35);
      }
    </style>
  
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
</head>
  <body class="auth-body">
    <div class="glass-card">
      <div class="icon-header">
        <i class="ri-shield-keyhole-line"></i>
      </div>
      <h1 style="color: #0f172a; font-size: 26px">Admin Portal</h1>
      <p style="color: #64748b; margin-bottom: 30px">
        Secure management access.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        "
      >
        {{ error }}
      </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Email Address</label>
          <input
            type="email"
            name="email"
            class="glass-input"
            required
            placeholder="admin@society.com"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Password</label>
          <input
            type="password"
            name="password"
            class="glass-input"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Security Check</label>
          <div class="captcha-container">
            <img
              id="captchaImg"
              src="{{ url_for('captcha') }}"
              alt="Captcha"
              style="border-radius: 8px"
            />
            <a
              href="javascript:void(0);"
              onclick="refreshCaptcha()"
              title="Refresh captcha"
              style="color: #ff9500; font-size: 20px; display:inline-flex; align-items:center; transition: transform 0.4s;"
              id="refreshIcon"
              ><i class="ri-refresh-line"></i
            ></a>
          </div>
          <input
            id="captchaInput"
            type="text"
            name="captcha"
            class="glass-input"
            required
            placeholder="Enter code"
            autocomplete="off"
          />
        </div>

        <button class="btn-glass">
          Access Dashboard <i class="ri-lock-unlock-line"></i>
        </button>
      </form>

      <div style="margin-top: 25px; font-size: 14px; color: #64748b">
        New Society?
        <a
          href="/admin/register"
          style="color: #ff8400; text-decoration: none; font-weight: 600"
          >Register Here</a
        >
        <br /><br />
        <a href="/" style="font-size: 12px; color: #64748b">Back to Home</a>
      </div>
    </div>

    <script>
      function refreshCaptcha() {
        // Update only the captcha image using a cache-busting timestamp
        const img = document.getElementById('captchaImg');
        const icon = document.getElementById('refreshIcon');
        const input = document.getElementById('captchaInput');

        // Spin animation
        icon.style.transform = 'rotate(360deg)';
        setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 420);

        // Reload captcha image without touching email/password
        img.src = '/captcha?' + Date.now();

        // Clear the captcha answer field and re-focus it
        input.value = '';
        input.focus();
      }
    </script>
  </body>
</html>
