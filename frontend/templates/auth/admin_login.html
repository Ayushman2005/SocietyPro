<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Portal | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    
    <style>
      .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-deep);
      }

      .glass-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 28px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .icon-header {
        font-size: 50px;
        color: #ff8c00;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.3));
      }

      .modern-input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .glass-input {
        width: 100%;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 15px;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        margin-top: 8px;
        outline: none;
        transition: all 0.3s ease;
      }

      .glass-input::placeholder {
        color: #94a3b8;
      }

      .glass-input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.12);
      }

      .captcha-container {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        padding: 10px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .btn-glass {
        background: linear-gradient(135deg, #ff8c00, #ff5500);
        color: #ffffff;
        border: none;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
      }

      .btn-glass:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 140, 0, 0.35);
      }
    </style>
  
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
  <body class="auth-body">
    <div class="glass-card">
      <div class="icon-header">
        <i class="ri-shield-keyhole-line"></i>
      </div>
      <h1 style="color: #0f172a; font-size: 26px">Admin Portal</h1>
      <p style="color: #64748b; margin-bottom: 30px">
        Secure management access.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        "
      >
        {{ error }}
      </div>
      {% endif %}

      <div
        id="jsError"
        style="
          display: none;
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        "
      >
      </div>

      <button type="button" id="googleLoginBtn" class="btn-google" onclick="handleFirebaseGoogleLogin()" style="margin-bottom: 20px;">
        <svg viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="googleBtnText">Sign in with Google</span>
      </button>
      
      <div style="text-align: center; margin-bottom: 20px; color: #64748b; font-size: 14px; font-weight: 600;">
        OR
      </div>

      <form action="/admin/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Email Address</label>
          <input
            type="email"
            name="email"
            class="glass-input"
            required
            placeholder="admin@society.com"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Password</label>
          <input
            type="password"
            name="password"
            class="glass-input"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600">Security Check</label>
          <div class="captcha-container">
            <img
              id="captchaImg"
              src="{{ url_for('captcha') }}"
              alt="Captcha"
              style="border-radius: 8px"
            />
            <a
              href="javascript:void(0);"
              onclick="refreshCaptcha()"
              title="Refresh captcha"
              style="color: #ff9500; font-size: 20px; display:inline-flex; align-items:center; transition: transform 0.4s;"
              id="refreshIcon"
              ><i class="ri-refresh-line"></i
            ></a>
          </div>
          <input
            id="captchaInput"
            type="text"
            name="captcha"
            class="glass-input"
            required
            placeholder="Enter code"
            autocomplete="off"
          />
        </div>

        <button class="btn-glass">
          Access Dashboard <i class="ri-lock-unlock-line"></i>
        </button>
      </form>

      <div style="margin-top: 25px; font-size: 14px; color: #64748b">
        New Society?
        <a
          href="/admin/register"
          style="color: #ff8400; text-decoration: none; font-weight: 600"
          >Register Here</a
        >
        <br /><br />
        <a href="/" style="font-size: 12px; color: #64748b">Back to Home</a>
      </div>
    </div>

    <script id="firebase-config-data" type="application/json">
      {{ FIREBASE_CONFIG | tojson }}
    </script>
    <script>
      const firebaseConfig = JSON.parse(document.getElementById('firebase-config-data').textContent || '{}');
      if (firebaseConfig && firebaseConfig.apiKey) {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
      }

      async function handleFirebaseGoogleLogin() {
        const btn = document.getElementById('googleLoginBtn');
        const btnText = document.getElementById('googleBtnText');
        const errDiv = document.getElementById('jsError');
        errDiv.style.display = 'none';

        if (!firebase.apps.length) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Firebase configuration is missing. Please set Firebase credentials in environment variables.';
          return;
        }

        try {
          btn.disabled = true;
          btnText.innerHTML = '<span class="spinner"></span> Connecting to Google...';

          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await firebase.auth().signInWithPopup(provider);
          const idToken = await result.user.getIdToken();

          const response = await fetch('/admin/google_login', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': document.querySelector('input[name="csrf_token"]').value
              },
              body: JSON.stringify({ idToken: idToken })
          });

          const data = await response.json();
          if (data.success) {
              window.location.href = data.redirect;
          } else {
              errDiv.style.display = 'block';
              errDiv.innerText = data.error || 'The mail id is not valid';
              btn.disabled = false;
              btnText.innerText = 'Sign in with Google';
          }
        } catch (error) {
          console.error('Firebase Auth Error:', error);
          btn.disabled = false;
          btnText.innerText = 'Sign in with Google';
          if (error.code !== 'auth/popup-closed-by-user') {
            errDiv.style.display = 'block';
            if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
              errDiv.innerText = 'Google Sign-In is not enabled in Firebase Console. Go to Firebase Console → Authentication → Sign-in method → Enable "Google", select a support email, and click Save.';
            } else if (error.code === 'auth/unauthorized-domain') {
              errDiv.innerText = 'Domain not authorized. Please add "localhost" to Firebase Console → Authentication → Settings → Authorized domains.';
            } else {
              errDiv.innerText = error.message || 'Google sign-in failed. Please try again.';
            }
          }
        }
      }

      function refreshCaptcha() {
        // Update only the captcha image using a cache-busting timestamp
        const img = document.getElementById('captchaImg');
        const icon = document.getElementById('refreshIcon');
        const input = document.getElementById('captchaInput');

        // Spin animation
        icon.style.transform = 'rotate(360deg)';
        setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 420);

        // Reload captcha image without touching email/password
        img.src = '/captcha?' + Date.now();

        // Clear the captcha answer field and re-focus it
        input.value = '';
        input.focus();
      }
    </script>
  </body>
</html>
