<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Register Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />


  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

<body class="auth-body">
  <div class="auth-container" style="max-width: 550px">
    <div style="margin-bottom: 20px">
      <i class="ri-building-4-line" style="font-size: 48px; color: var(--primary)"></i>
    </div>
    <h1>Register Society</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px">
      Create a new digital space for your community.
    </p>

    <div id="jsError" style="
          display: none;
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        ">
    </div>

    <button type="button" id="googleSignupBtn" class="btn-google" onclick="handleFirebaseGoogleSignup()" style="margin-bottom: 20px;">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="googleBtnText">Auto-fill with Google</span>
    </button>
    <div style="text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 14px; font-weight: 600;">
      OR manually enter details
    </div>

    <form action="/admin/register" method="POST" id="registerForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="split-grid-1-1" style="gap: 15px; text-align: left;">
        <div>
          <label class="modern-label">Admin Name</label>
          <input type="text" name="name" id="adminNameInput" required placeholder="Your Name" />
        </div>
        <div>
          <label class="modern-label">Society Name</label>
          <input type="text" name="society_name" id="societyNameInput" required placeholder="e.g. Galaxy Heights" />
        </div>
      </div>

      <div style="text-align: left">
        <label class="modern-label">Email Address</label>
        <input type="email" name="email" id="adminEmailInput" required placeholder="admin@example.com" />
      </div>

      <div style="text-align: left">
        <label class="modern-label">Password</label>
        <input type="password" name="password" id="adminPasswordInput" required placeholder="Create a strong password" />
      </div>

      <button class="btn-auth" style="margin-top: 15px">
        Create Account <i class="ri-rocket-line"></i>
      </button>
    </form>

    <div style="margin-top: 25px; font-size: 14px; color: var(--text-muted)">
      Already registered?
      <a href="/admin/login" class="auth-link">Login Here</a>
    </div>
  </div>

  <script id="firebase-config-data" type="application/json">
    {{ FIREBASE_CONFIG | tojson }}
  </script>
  <script>
    const firebaseConfig = JSON.parse(document.getElementById('firebase-config-data').textContent || '{}');
    if (firebaseConfig && firebaseConfig.apiKey) {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
    }

    async function handleFirebaseGoogleSignup() {
      const btn = document.getElementById('googleSignupBtn');
      const btnText = document.getElementById('googleBtnText');
      const errDiv = document.getElementById('jsError');
      errDiv.style.display = 'none';

      if (!firebase.apps.length) {
        errDiv.style.display = 'block';
        errDiv.innerText = 'Firebase configuration is missing. Please set Firebase credentials in environment variables.';
        return;
      }

      try {
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Connecting to Google...';

        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;

        document.getElementById('adminNameInput').value = user.displayName || '';
        document.getElementById('adminEmailInput').value = user.email || '';

        let flashDev = document.getElementById('jsSuccess');
        if (!flashDev) {
          flashDev = document.createElement('div');
          flashDev.id = 'jsSuccess';
          flashDev.style.background = 'rgba(34, 197, 94, 0.1)';
          flashDev.style.color = '#16a34a';
          flashDev.style.padding = '12px';
          flashDev.style.borderRadius = '10px';
          flashDev.style.marginBottom = '20px';
          flashDev.style.fontSize = '14px';
          flashDev.style.border = '1px solid rgba(34, 197, 94, 0.2)';

          const form = document.getElementById('registerForm');
          form.parentNode.insertBefore(flashDev, form);
        }
        flashDev.innerText = "✅ Google details retrieved. Please enter your Society Name and choose a Password to complete registration.";

        btn.disabled = false;
        btnText.innerText = 'Auto-fill with Google';
        document.getElementById('societyNameInput').focus();
      } catch (error) {
        console.error('Firebase Auth Error:', error);
        btn.disabled = false;
        btnText.innerText = 'Auto-fill with Google';
        if (error.code !== 'auth/popup-closed-by-user') {
          errDiv.style.display = 'block';
          if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
            errDiv.innerText = 'Google Sign-In is not enabled in Firebase Console. Go to Firebase Console → Authentication → Sign-in method → Enable "Google", select a support email, and click Save.';
          } else if (error.code === 'auth/unauthorized-domain') {
            errDiv.innerText = 'Domain not authorized. Please add "localhost" to Firebase Console → Authentication → Settings → Authorized domains.';
          } else {
            errDiv.innerText = error.message || 'Google signup connection failed. Please try again.';
          }
        }
      }
    }
  </script>
</body>

</html>
