<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Register Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />


  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth-body">
  <div class="auth-container" style="max-width: 550px">
    <div style="margin-bottom: 20px">
      <i class="ri-building-4-line" style="font-size: 48px; color: var(--primary)"></i>
    </div>
    <h1>Register Society</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px">
      Create a new digital space for your community.
    </p>

    <!-- Google Sign Up Helper -->
    <div id="g_id_onload"
         data-client_id="{{ GOOGLE_CLIENT_ID }}"
         data-context="signup"
         data-ux_mode="popup"
         data-callback="handleGoogleSignup"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signup_with"
         data-size="large"
         data-logo_alignment="center"
         style="display: flex; justify-content: center; margin-bottom: 20px;">
    </div>
    <div style="text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 14px; font-weight: 600;">
      OR manually enter details
    </div>

    <form action="/admin/register" method="POST" id="registerForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="split-grid-1-1" style="gap: 15px; text-align: left;">
        <div>
          <label class="modern-label">Admin Name</label>
          <input type="text" name="name" required placeholder="Your Name" />
        </div>
        <div>
          <label class="modern-label">Society Name</label>
          <input type="text" name="society_name" required placeholder="e.g. Galaxy Heights" />
        </div>
      </div>

      <div style="text-align: left">
        <label class="modern-label">Email Address</label>
        <input type="email" name="email" required placeholder="admin@example.com" />
      </div>

      <div style="text-align: left">
        <label class="modern-label">Password</label>
        <input type="password" name="password" required placeholder="Create a strong password" />
      </div>

      <button class="btn-auth" style="margin-top: 15px">
        Create Account <i class="ri-rocket-line"></i>
      </button>
    </form>

    <div style="margin-top: 25px; font-size: 14px; color: var(--text-muted)">
      Already registered?
      <a href="/admin/login" class="auth-link">Login Here</a>
    </div>
  </div>

  <script>
    function handleGoogleSignup(response) {
      try {
          const payload = JSON.parse(atob(response.credential.split('.')[1]));
          document.querySelector('input[name="name"]').value = payload.name || "";
          document.querySelector('input[name="email"]').value = payload.email || "";
          
          let flashDev = document.getElementById('jsSuccess');
          if (!flashDev) {
              flashDev = document.createElement('div');
              flashDev.id = 'jsSuccess';
              flashDev.style.background = 'rgba(34, 197, 94, 0.1)';
              flashDev.style.color = '#16a34a';
              flashDev.style.padding = '12px';
              flashDev.style.borderRadius = '10px';
              flashDev.style.marginBottom = '20px';
              flashDev.style.fontSize = '14px';
              flashDev.style.border = '1px solid rgba(34, 197, 94, 0.2)';
              
              const form = document.getElementById('registerForm');
              form.parentNode.insertBefore(flashDev, form);
          }
          flashDev.innerText = "Google details securely retrieved. Please enter Society Name and your new Password, then Create Account.";
      } catch (e) {
          console.error("Error decoding token");
      }
    }
  </script>
</body>

</html>
