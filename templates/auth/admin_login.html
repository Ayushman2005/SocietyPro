<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Portal | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/906/906343.png">
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --accent-gradient: linear-gradient(135deg, #ff8c00 100%);
      }

      .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .icon-header {
        font-size: 50px;
        color: #ff8c00;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255, 46, 99, 0.4));
      }

      .modern-input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .glass-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 12px 15px;
        color: white;
        margin-top: 8px;
        outline: none;
      }

      .glass-input:focus {
        border-color: #ff2e63;
        background: rgb(0, 0, 0);
      }

      .captcha-container {
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(255, 255, 255, 0.03);
        padding: 10px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .btn-glass {
        background: var(--accent-gradient);
        color: white;
        border: none;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
      }

      .btn-glass:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body class="auth-body">
    <div class="glass-card">
      <div class="icon-header">
        <i class="ri-shield-keyhole-line"></i>
      </div>
      <h1 style="color: white; font-size: 26px">Admin Portal</h1>
      <p style="color: #94a3b8; margin-bottom: 30px">
        Secure management access.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        "
      >
        {{ error }}
      </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="modern-input-group">
          <label style="color: #cbd5e1; font-size: 14px">Email Address</label>
          <input
            type="email"
            name="email"
            class="glass-input"
            required
            placeholder="admin@society.com"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #cbd5e1; font-size: 14px">Password</label>
          <input
            type="password"
            name="password"
            class="glass-input"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #cbd5e1; font-size: 14px">Security Check</label>
          <div class="captcha-container">
            <img
              src="{{ url_for('captcha') }}"
              alt="Captcha"
              style="border-radius: 8px"
            />
            <a
              href="javascript:location.reload();"
              style="color: #ff9500; font-size: 20px"
              ><i class="ri-refresh-line"></i
            ></a>
          </div>
          <input
            type="text"
            name="captcha"
            class="glass-input"
            required
            placeholder="Enter code"
            autocomplete="off"
          />
        </div>

        <button class="btn-glass">
          Access Dashboard <i class="ri-lock-unlock-line"></i>
        </button>
      </form>

      <div style="margin-top: 25px; font-size: 14px; color: #94a3b8">
        New Society?
        <a
          href="/admin/register"
          style="color: #ff8400; text-decoration: none; font-weight: 600"
          >Register Here</a
        >
        <br /><br />
        <a href="/" style="font-size: 12px; color: #64748b">Back to Home</a>
      </div>
    </div>
  </body>
</html>
