<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/906/906343.png" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div style="margin-bottom: 20px">
        <i
          class="ri-shield-keyhole-line"
          style="font-size: 48px; color: #ff2e63"
        ></i>
      </div>
      <h1>Admin Portal</h1>
      <p style="color: var(--text-muted); margin-bottom: 30px">
        Secure access for management.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 10px;
          border-radius: 8px;
          margin-bottom: 20px;
          font-size: 14px;
        "
      >
        {{ error }}
      </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div style="text-align: left">
          <label class="modern-label">Email Address</label>
          <input
            type="email"
            name="email"
            required
            placeholder="admin@society.com"
          />
        </div>

        <div style="text-align: left">
          <label class="modern-label">Password</label>
          <input
            type="password"
            name="password"
            required
            placeholder="••••••••"
          />
        </div>

        <button class="btn-auth" style="margin-top: 15px">
          Access Dashboard <i class="ri-lock-unlock-line"></i>
        </button>
      </form>

      <div style="margin-top: 25px; font-size: 14px; color: var(--text-muted)">
        New Society?
        <a href="/admin/register" class="auth-link">Register Here</a>
        <br /><br />
        <a href="/" style="font-size: 12px; color: #666">Back to Home</a>
      </div>
    </div>
  </body>
</html>
