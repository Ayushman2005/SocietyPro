<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Resident Login | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    
    <style>
      :root {
        --user-gradient: linear-gradient(135deg, #ff7b00 0%, #ff5500 100%);
      }

      .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-deep);
      }

      .glass-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 28px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .user-icon-badge {
        width: 70px;
        height: 70px;
        background: var(--user-gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 35px;
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(255, 123, 0, 0.35);
      }

      .modern-input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .glass-input {
        width: 100%;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px 18px;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        margin-top: 8px;
        transition: all 0.3s ease;
        outline: none;
      }

      .glass-input::placeholder {
        color: #94a3b8;
      }

      .glass-input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.12);
      }

      .btn-user {
        background: var(--user-gradient);
        color: #ffffff;
        border: none;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn-user:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 123, 0, 0.4);
      }
    </style>
  
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
</head>
  <body class="auth-body">
    <div class="glass-card">
      <div class="user-icon-badge">
        <i class="ri-user-smile-line"></i>
      </div>
      <h1 style="color: #0f172a; font-size: 28px; letter-spacing: -0.5px">
        Resident Login
      </h1>
      <p style="color: #64748b; margin-bottom: 35px">
        Welcome back to your society portal.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 25px;
          font-size: 14px;
          border: 1px solid rgba(239, 68, 68, 0.2);
        "
      >
        <i class="ri-error-warning-line"></i> {{ error }}
      </div>
      {% endif %}

      <form action="/user/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600"
            >Email ID</label
          >
          <input
            type="email"
            name="email"
            class="glass-input"
            required
            placeholder="yourname@email.com"
          />
        </div>

        <div class="modern-input-group">
          <label style="color: #475569; font-size: 14px; font-weight: 600"
            >Password</label
          >
          <input
            type="password"
            name="password"
            class="glass-input"
            required
            placeholder="••••••••"
          />
        </div>

        <button class="btn-user">
          Sign In to Dashboard <i class="ri-arrow-right-circle-line"></i>
        </button>
      </form>

      <div
        style="
          margin-top: 30px;
          border-top: 1px solid var(--glass-border);
          padding-top: 20px;
        "
      >
        <a
          href="/"
          style="
            font-size: 14px;
            color: #64748b;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
          "
        >
          <i class="ri-home-4-line"></i> Back to Main Website
        </a>
      </div>
    </div>
  </body>
</html>
