<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Resident Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/3637/3637797.png" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div style="margin-bottom: 20px">
        <i
          class="ri-user-smile-line"
          style="font-size: 48px; color: var(--primary)"
        ></i>
      </div>
      <h1>Resident Login</h1>
      <p style="color: var(--text-muted); margin-bottom: 30px">
        Access your personal dashboard.
      </p>

      {% if error %}
      <div
        style="
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          padding: 10px;
          border-radius: 8px;
          margin-bottom: 20px;
          font-size: 14px;
        "
      >
        {{ error }}
      </div>
      {% endif %}

      <form action="/user/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div style="text-align: left">
          <label class="modern-label">Email Address</label>
          <input
            type="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>

        <div style="text-align: left">
          <label class="modern-label">Password</label>
          <input
            type="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>

        <button class="btn-auth" style="margin-top: 15px">
          Login Now <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <div style="margin-top: 25px; font-size: 13px; color: var(--text-muted)">
        <a href="/" class="auth-link">Back to Home</a>
      </div>
    </div>
  </body>
</html>
