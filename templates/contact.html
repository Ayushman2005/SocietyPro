<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us - SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    

    <style>
      /* Success Modal Styles */
      .modal-overlay {
        display: none; /* Hidden by default */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
      }

      .modal-content {
        background: rgba(30, 30, 30, 0.9);
        border: 1px solid var(--primary);
        padding: 40px;
        border-radius: 24px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 0 50px rgba(255, 140, 0, 0.2);
        transform: scale(0.9);
        animation: scaleUp 0.3s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scaleUp {
        from {
          transform: scale(0.9);
        }
        to {
          transform: scale(1);
        }
      }
    </style>
  
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>">
</head>
  <body class="landing-body">
    <nav class="navbar">
      <div class="logo"><i class="ri-building-2-fill"></i> SocietyPro</div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/features">Features</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <button
            class="btn-primary"
            onclick="location.href = '/login'"
            style="width: auto; padding: 15px 40px"
          >
            Start Now
          </button>
      </div>
      <div class="hamburger"><i class="ri-menu-3-line"></i></div>
    </nav>

    <section
      class="hero"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 80px 5%;
        min-height: 80vh;
      "
    >
      <div
        class="glass-panel"
        style="width: 100%; max-width: 600px; padding: 40px; position: relative"
      >
        <div
          style="
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: var(--primary);
            filter: blur(90px);
            opacity: 0.4;
            z-index: -1;
          "
        ></div>

        <div style="text-align: center; margin-bottom: 30px">
          <h1
            style="
              font-family: &quot;Outfit&quot;;
              font-size: 36px;
              margin-bottom: 10px;
            "
          >
            Get in Touch
          </h1>
          <p style="color: var(--text-muted)">
            We'd love to hear from you. Send us a message!
          </p>
        </div>

        <form
          id="contactForm"
          action="https://formspree.io/f/xreaenow"
          method="POST"
        >
          <div style="margin-bottom: 20px">
            <label class="modern-label">Full Name</label>
            <div style="position: relative">
              <i
                class="ri-user-line"
                style="position: absolute; left: 15px; top: 14px; color: #666"
              ></i>
              <input
                type="text"
                name="name"
                required
                placeholder="Enter your name"
                style="padding-left: 45px"
              />
            </div>
          </div>

          <div style="margin-bottom: 20px">
            <label class="modern-label">Email Address</label>
            <div style="position: relative">
              <i
                class="ri-mail-line"
                style="position: absolute; left: 15px; top: 14px; color: #666"
              ></i>
              <input
                type="email"
                name="email"
                required
                placeholder="name@example.com"
                style="padding-left: 45px"
              />
            </div>
          </div>

          <div style="margin-bottom: 30px">
            <label class="modern-label">Comments / Message</label>
            <div style="position: relative">
              <i
                class="ri-message-2-line"
                style="position: absolute; left: 15px; top: 14px; color: #666"
              ></i>
              <textarea
                name="message"
                rows="5"
                required
                placeholder="How can we help you?"
                style="padding-left: 45px"
              ></textarea>
            </div>
          </div>

          <button id="submitBtn" class="btn-primary" style="width: 100%">
            Submit Inquiry <i class="ri-send-plane-fill"></i>
          </button>
        </form>
      </div>
    </section>

    <div id="successModal" class="modal-overlay">
      <div class="modal-content">
        <i
          class="ri-checkbox-circle-fill"
          style="font-size: 60px; color: #10b981; margin-bottom: 20px"
        ></i>
        <h2
          style="
            color: white;
            margin-bottom: 10px;
            font-family: &quot;Outfit&quot;;
          "
        >
          Inquiry Sent!
        </h2>
        <p style="color: var(--text-muted); margin-bottom: 30px">
          Thank you for reaching out. We will get back to you shortly.
        </p>
        <button class="btn-primary" onclick="closeModal()">Close</button>
      </div>
    </div>

    <footer
      style="
        background: black;
        padding: 20px;
        text-align: center;
        color: #666;
        border-top: 1px solid #222;
      "
    >
      &copy; 2026 SocietyPro Management System. All rights reserved.
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
      const form = document.getElementById("contactForm");
      const modal = document.getElementById("successModal");
      const btn = document.getElementById("submitBtn");

      function closeModal() {
        modal.style.display = "none";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault(); // Stop redirect

        btn.innerHTML = 'Sending... <i class="ri-loader-4-line ri-spin"></i>';

        const formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            Accept: "application/json",
          },
        })
          .then((response) => {
            if (response.ok) {
              modal.style.display = "flex"; // Show Pop-up
              form.reset(); // Clear form
            } else {
              alert("Oops! There was a problem submitting your form.");
            }
            btn.innerHTML = 'Submit Inquiry <i class="ri-send-plane-fill"></i>';
          })
          .catch((error) => {
            alert("Oops! There was a problem submitting your form.");
            btn.innerHTML = 'Submit Inquiry <i class="ri-send-plane-fill"></i>';
          });
      });
    </script>
  </body>
</html>
