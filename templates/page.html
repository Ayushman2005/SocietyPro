<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select Portal | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/10307/10307344.png" />
  </head>
  <body class="auth-body">
    <div class="auth-container" style="max-width: 500px">
      <div style="margin-bottom: 30px">
        <i
          class="ri-building-2-line"
          style="font-size: 48px; color: var(--primary)"
        ></i>
      </div>

      <h1 style="font-size: 32px; margin-bottom: 10px">Welcome Back</h1>
      <p style="color: var(--text-muted); margin-bottom: 40px">
        Select your access level to continue.
      </p>

      <div class="role-grid">
        <a href="/user/login" class="role-card">
          <div class="role-icon">
            <i class="ri-user-smile-line"></i>
          </div>
          <span class="role-title">Resident</span>
          <span class="role-desc"
            >Pay bills, book amenities, & view notices.</span
          >
        </a>

        <a href="/admin/login" class="role-card">
          <div class="role-icon">
            <i class="ri-shield-user-line"></i>
          </div>
          <span class="role-title">Admin</span>
          <span class="role-desc"
            >Manage finances, users, & security logs.</span
          >
        </a>
      </div>

      <div
        style="
          margin-top: 40px;
          border-top: 1px solid var(--border-subtle);
          padding-top: 20px;
        "
      >
        <a
          href="/"
          style="
            color: var(--text-muted);
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
          "
        >
          <i class="ri-arrow-left-line"></i> Back to Homepage
        </a>
      </div>
    </div>
  </body>
</html>
