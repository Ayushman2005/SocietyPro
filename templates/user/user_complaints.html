<!doctype html>
<html lang="en">
  <head>
    <title>Helpdesk | SocietyPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo"><i class="ri-home-heart-line"></i> ResidentPanel</div>
        <ul class="menu">
          <li>
            <a href="/user/dashboard"><i class="ri-dashboard-line"></i> Home</a>
          </li>
          <li>
            <a href="/user/bookings"
              ><i class="ri-calendar-check-line"></i> Bookings</a
            >
          </li>
          <li>
            <a href="/user/visitors"
              ><i class="ri-shield-user-line"></i> Visitors</a
            >
          </li>
          <li>
            <a href="/user/polls"
              ><i class="ri-bar-chart-box-line"></i> Polls</a
            >
          </li>
          <li>
            <a href="/user/notices"
              ><i class="ri-notification-3-line"></i> Notices</a
            >
          </li>
          <li>
            <a href="/user/complaints" class="active"
              ><i class="ri-feedback-line"></i> Complaints</a
            >
          </li>
          <li>
            <a href="/user/emergency"
              ><i class="ri-phone-fill"></i> Emergency</a
            >
          </li>
          <li>
            <a href="/profile"><i class="ri-user-settings-line"></i> Profile</a>
          </li>
        </ul>
        <a href="/logout" class="logout-btn"
          ><i class="ri-logout-box-line"></i> Logout</a
        >
      </aside>

      <main class="main-content">
        <div class="header-section">
          <div class="header-title">
            <h1>Helpdesk</h1>
            <p>Report issues and track resolutions.</p>
          </div>
        </div>

        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
          "
        >
          <div class="form-box">
            <h3 style="margin-bottom: 20px">
              <i class="ri-flag-line"></i> Raise a Ticket
            </h3>
            <form method="POST">
              <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
              />

              <label class="modern-label">Subject</label>
              <input
                type="text"
                name="subject"
                required
                placeholder="e.g. Water Leakage"
              />

              <label class="modern-label">Description</label>
              <textarea
                name="description"
                rows="5"
                required
                placeholder="Describe the issue..."
              ></textarea>

              <button type="submit" class="btn-primary" style="width: 100%">
                Submit Complaint
              </button>
            </form>
          </div>

          <div>
            <h3 style="margin-bottom: 20px">My Tickets</h3>
            <div class="cards" style="grid-template-columns: 1fr">
              {% for c in complaints %}
              <div class="card">
                <div class="card-header">
                  <span>{{ c[3] }}</span>
                  <span
                    class="status {% if c[2]=='Resolved' %}paid{% else %}unpaid{% endif %}"
                    >{{ c[2] }}</span
                  >
                </div>
                <h3 style="font-size: 18px">{{ c[0] }}</h3>
                <p style="color: var(--text-muted); font-size: 14px">
                  {{ c[1] }}
                </p>
              </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
